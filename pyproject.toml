[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-ranker"
version = "0.4.0"
description = "Lab that ranks unusual sessions under an analyst budget k."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "David Jaimes Olivo" }]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
session-ranker = "log_analyzer:main"

[tool.setuptools]
py-modules = ["detector", "log_analyzer", "simulator", "sweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
